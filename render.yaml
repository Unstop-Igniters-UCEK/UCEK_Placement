services:
  - type: web
    name: impulse-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_SECRET_KEY
        sync: false
      - key: ADMIN_DEFAULT_PASSWORD
        sync: false
      - key: INITIAL_STUDENT_PASSWORD
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: HR_TRANSCRIPTION_PROVIDER
        value: gemini
      - key: HR_TRANSCRIPTION_MODEL
        value: gemini-3.5-transcribe
      - key: HR_EVALUATION_PROVIDER
        value: gemini
      - key: HR_EVALUATION_MODEL
        value: gemini-3.5-flash-lite
      - key: AI_REQUESTS_PER_MINUTE
        value: "5"
