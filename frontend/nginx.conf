# frontend/nginx.conf
# Impulse UCEK Placement -- Nginx configuration template
#
# This file is processed by envsubst at container startup.
# Variables substituted: ${BACKEND_URL}
#
# Set BACKEND_URL at runtime:
#   Docker Compose: BACKEND_URL=http://backend:8000
#   Render:         BACKEND_URL=http://impulse-backend  (private service hostname)

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml;

    # Static assets (Vite hashed filenames -- long cache OK)
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp|avif|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API reverse proxy -- proxies /api/* to the FastAPI backend
    location /api/ {
        proxy_pass ${BACKEND_URL}/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Forward auth + content headers (required for JWT + JSON body)
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type $content_type;

        # Forward cookies (httponly refresh token is cookie-based)
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;

        # Timeouts: Gemini AI calls can take 30-90s
        proxy_read_timeout 120s;
        proxy_connect_timeout 15s;
        proxy_send_timeout 30s;

        proxy_buffering off;
        proxy_request_buffering off;
    }

    # SPA fallback -- all unmatched routes return index.html for React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
